<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d162b">
<title>AI学习系统</title>
<style>
:root{
  --navy:#0d162b;--navy2:#16233e;--blue:#2455a6;--text:#172033;
  --muted:#7b8494;--line:#e7e9ee;--bg:#f5f6f8;--card:#fff;--soft:#eef2f7;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.hero{background:linear-gradient(155deg,#09111f,#17233b 65%,#111a2e);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 24px;border-radius:0 0 26px 26px}
.hero .date{font-size:13px;opacity:.68;margin-bottom:8px}.hero h1{margin:0;font-size:32px;letter-spacing:-1px}.hero .sub{margin-top:7px;font-size:14px;opacity:.72}
.wrap{padding:18px 16px}.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(15,25,45,.02);border:1px solid #eef0f4}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.title{font-size:18px;font-weight:750}.count{font-size:13px;color:var(--muted)}
.progressbar{height:10px;background:#edf0f4;border-radius:999px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--blue);border-radius:999px;width:0%;transition:.25s}
.daypill{background:#f0f2f5;color:#707887;border-radius:999px;padding:6px 10px;font-size:12px}
.classrow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.classrow:last-child{border-bottom:0;padding-bottom:2px}
.time{width:72px;flex:none;font-size:12px;color:#6f7786;line-height:1.5}.classname{font-weight:700;font-size:15px}.room{margin-top:4px;color:#697384;font-size:12px}.weeks{margin-top:3px;color:#9aa1ad;font-size:11px}
.empty{color:#9aa1ad;font-size:14px;padding:8px 0}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.check{appearance:none;width:24px;height:24px;border:2px solid #aeb4bf;border-radius:7px;flex:none;margin-top:1px;background:#fff}.check:checked{background:var(--blue);border-color:var(--blue);position:relative}.check:checked:after{content:"✓";color:#fff;font-weight:800;position:absolute;left:4px;top:-1px}
.task.done .tt{color:#a0a6b0;text-decoration:line-through}.tt{font-size:15px;font-weight:700}.tag{display:inline-block;background:#eef1f5;color:#697283;border-radius:999px;padding:3px 7px;font-size:10px;margin-right:6px}.desc{font-size:12px;color:#7a8391;margin-top:4px;line-height:1.5}
.addbtn{border:0;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}.primary{background:var(--blue)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(680px,100%);height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #e6e8ed;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:#8b93a0;font-size:11px}.nav button.active{color:var(--navy);font-weight:700}.nav .ico{display:block;font-size:19px;margin-bottom:3px}
.page{display:none}.page.active{display:block}
.listbtn{width:100%;text-align:left;border:0;background:#fff;padding:14px 0;border-bottom:1px solid var(--line)}
select,textarea,input[type=text]{width:100%;border:1px solid #dfe3ea;border-radius:12px;padding:11px;background:#fff;outline:none}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}.small{font-size:12px;color:var(--muted);line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;padding:70px 16px 20px}.modal.show{display:block}.modalbox{background:#fff;border-radius:20px;padding:18px;max-width:620px;margin:auto;max-height:85vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0f2f5;border-radius:50%;width:34px;height:34px}
@media(min-width:681px){body{padding:20px 0}.app{box-shadow:0 10px 40px rgba(0,0,0,.08);border-radius:28px;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="date" id="dateLine"></div>
    <h1>今日学习</h1>
    <div class="sub" id="weekLine"></div>
  </section>

  <main class="wrap">
    <section id="home" class="page active">
      <div class="card">
        <div class="cardhead"><div class="title">今日进度</div><div class="count" id="progressText">0/5</div></div>
        <div class="progressbar"><i id="progressFill"></i></div>
      </div>

      <div class="card">
        <div class="cardhead"><div class="title">今天的课</div><div class="daypill" id="dayPill">星期一</div></div>
        <div id="todayClasses"></div>
      </div>

      <div class="card">
        <div class="cardhead"><div class="title">今天要做</div><button class="addbtn" onclick="openTaskModal()">＋ 添加</button></div>
        <div id="tasks"></div>
      </div>
    </section>

    <section id="schedule" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">本周课程</div><div class="small" id="scheduleWeek"></div></div>
        <div id="weekSchedule"></div>
      </div>
    </section>

    <section id="courses" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">课程</div></div>
        <div id="courseList"></div>
      </div>
    </section>

    <section id="methods" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">方法 / 知识库</div><button class="addbtn" onclick="openMethodModal()">＋ 添加</button></div>
        <div id="methodList"></div>
      </div>
    </section>

    <section id="wrong" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">错题</div></div>
        <div id="wrongList" class="empty">做题后，错题会自动记录在这里。</div>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="active" onclick="showPage('home',this)"><span class="ico">⌂</span>今日学习</button>
    <button onclick="showPage('schedule',this)"><span class="ico">▦</span>课程表</button>
    <button onclick="showPage('courses',this)"><span class="ico">◫</span>课程</button>
    <button onclick="showPage('methods',this)"><span class="ico">≡</span>知识库</button>
    <button onclick="showPage('wrong',this)"><span class="ico">✓</span>错题</button>
  </nav>
</div>

<div class="modal" id="taskModal"><div class="modalbox">
  <div class="modalhead"><div class="title">添加今日任务</div><button class="close" onclick="closeModal('taskModal')">×</button></div>
  <label>任务名称</label><input id="taskName" type="text" placeholder="例如：复习高数第七节">
  <label>课程</label><select id="taskCourse"></select>
  <label>说明</label><textarea id="taskDesc" rows="3" placeholder="写下具体要做什么"></textarea>
  <button class="addbtn primary" style="width:100%;margin-top:14px" onclick="saveTask()">保存</button>
</div></div>

<div class="modal" id="methodModal"><div class="modalbox">
  <div class="modalhead"><div class="title">添加方法 / 知识点</div><button class="close" onclick="closeModal('methodModal')">×</button></div>
  <label>名称</label><input id="methodName" type="text" placeholder="例如：洛必达法则">
  <label>分类</label><select id="methodCourse"></select>
  <label>内容</label><textarea id="methodContent" rows="5" placeholder="公式、适用条件、做题方法……"></textarea>
  <button class="addbtn primary" style="width:100%;margin-top:14px" onclick="saveMethod()">保存</button>
</div></div>

<script>
const START = new Date("2026-09-07T00:00:00");
const times = {
  1:["08:30–10:00","10:20–11:50","14:00–15:30","15:50–18:10","19:00–21:20"],
  2:["08:30–10:00","10:20–11:50","14:00–15:30","19:00–21:20"],
  3:["08:30–10:00","10:20–11:50","14:00–15:30","15:50–18:10","19:00–21:20"],
  4:["08:30–10:00","10:20–11:50"],
  5:["08:30–10:00","10:20–11:50","14:00–15:30","15:50–18:10"]
};
const classes = [
 {d:1,t:0,n:"大学英语AI",r:"20208",w:"3–16周"},
 {d:1,t:1,n:"英语口语（ACCA&CIMA）",r:"20201",w:"3–16周"},
 {d:1,t:2,n:"专业英语",r:"20201",w:"3–16周"},
 {d:1,t:3,n:"中国近现代史纲要",r:"20214",w:"3–16周"},
 {d:1,t:4,n:"职业生涯规划与就业指导",r:"20307",w:"4–11周"},
 {d:1,t:4,n:"管理学实验",r:"20307",w:"12–16周"},

 {d:2,t:0,n:"心理健康",r:"20214",w:"7、9、11、13周"},
 {d:2,t:1,n:"高等数学",r:"20113",w:"3–17周"},
 {d:2,t:2,n:"大学体育1（气排球）",r:"崇德楼室外篮球场04",w:"3–17周"},
 {d:2,t:3,n:"会计学",r:"20102",w:"4–14周"},

 {d:3,t:0,n:"大学英语AI",r:"20102",w:"4、6、8、10、12、14、16周"},
 {d:3,t:0,n:"大学英语AI",r:"30203",w:"3、5、7、9、11、13、15周"},
 {d:3,t:1,n:"计算思维导论",r:"20102",w:"3–14周（隔周）"},
 {d:3,t:1,n:"英语口语（ACCA&CIMA）",r:"20102",w:"15–16周"},
 {d:3,t:2,n:"管理学",r:"20315",w:"3–12周"},
 {d:3,t:3,n:"高等数学",r:"20213",w:"3–17周"},
 {d:3,t:4,n:"形势与政策",r:"20309",w:"5、7、9、11、13周"},

 {d:4,t:0,n:"ACCA导论",r:"20102",w:"3、5–15周"},
 {d:4,t:1,n:"管理学实验",r:"20209",w:"16周"},

 {d:5,t:0,n:"英语写作CI",r:"20213",w:"3–16周"},
 {d:5,t:1,n:"计算思维导论实验",r:"30305",w:"3–17周"},
 {d:5,t:2,n:"管理学",r:"20313",w:"3–12周"},
 {d:5,t:3,n:"专业英语",r:"20102",w:"15–16周"}
];

const courses=["高等数学","CET-4","会计学","会计专业英语","大学英语AI","计算思维导论","管理学","ACCA导论","英语口语","英语写作","中国近现代史纲要","心理健康","大学体育","形势与政策","职业生涯规划与就业指导"];

const defaultTasks=[
 ["四级词汇","CET-4","完成今天安排的词汇 + 昨日遗忘词复习"],
 ["四级听力","CET-4","完成今天指定真题听力；做完记录听不懂的位置"],
 ["高数复习","高等数学","复习当前章节的定义、公式与典型题，不跳过基础概念"],
 ["专业英语","会计专业英语","复习课堂专业词汇和老师讲过的重点"],
 ["当天课程整理","其他","把今天课堂讲到的重点整理进对应知识库"]
];

function getWeek(d=new Date()){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
  return Math.floor((x-s)/86400000/7)+1;
}
function inWeek(spec,w){
  if(spec.includes("–")){let [a,b]=spec.split("–").map(Number);return w>=a&&w<=b}
  const nums=[...spec.matchAll(/\d+/g)].map(x=>Number(x[0]));
  return nums.includes(w);
}
function dayName(d){return ["","星期一","星期二","星期三","星期四","星期五","星期六","星期日"][d]}
function getDay(){let d=new Date().getDay();return d===0?7:d}
function todayClasses(){
  const d=getDay(),w=getWeek();
  return classes.filter(c=>c.d===d&&inWeek(c.w,w));
}
function fmtDate(){
  const d=new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${dayName(getDay())}`;
}
function renderHeader(){
  document.getElementById("dateLine").textContent=fmtDate();
  const w=getWeek();
  document.getElementById("weekLine").textContent=`第 ${w} 周 · ${w>=1&&w<=16?"正常教学周":"考试/非教学周"}`;
  document.getElementById("dayPill").textContent=dayName(getDay());
  document.getElementById("scheduleWeek").textContent=`第 ${w} 周`;
}
function renderClasses(){
  const list=todayClasses();
  const el=document.getElementById("todayClasses");
  if(!list.length){el.innerHTML='<div class="empty">今天没有安排的课程。</div>';return}
  el.innerHTML=list.map(c=>`<div class="classrow">
    <div class="time">${times[c.d][c.t]}</div>
    <div><div class="classname">${c.n}</div><div class="room">教室：${c.r}</div><div class="weeks">${c.w}</div></div>
  </div>`).join("");
}
function taskStore(){return JSON.parse(localStorage.getItem("ai_v15_tasks")||"[]")}
function saveTaskStore(x){localStorage.setItem("ai_v15_tasks",JSON.stringify(x))}
function getTodayTasks(){
  const dateKey=new Date().toISOString().slice(0,10);
  const custom=taskStore().filter(x=>x.date===dateKey);
  if(custom.length)return custom;
  return defaultTasks.map((x,i)=>({id:"d"+i,name:x[0],course:x[1],desc:x[2],done:false,date:dateKey}));
}
function renderTasks(){
  const tasks=getTodayTasks();
  const el=document.getElementById("tasks");
  el.innerHTML=tasks.map((t,i)=>`<div class="task ${t.done?"done":""}">
    <input class="check" type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${i})">
    <div><div class="tt">${t.name}</div><div class="desc"><span class="tag">${t.course}</span>${t.desc}</div></div>
  </div>`).join("");
  const done=tasks.filter(x=>x.done).length,total=tasks.length;
  document.getElementById("progressText").textContent=`${done}/${total}`;
  document.getElementById("progressFill").style.width=total?`${done/total*100}%`:"0%";
}
function toggleTask(i){
  const tasks=getTodayTasks();tasks[i].done=!tasks[i].done;saveTaskStore(tasks);renderTasks();
}
function openTaskModal(){
  document.getElementById("taskCourse").innerHTML=courses.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("taskModal").classList.add("show");
}
function saveTask(){
  const name=document.getElementById("taskName").value.trim();if(!name)return;
  const dateKey=new Date().toISOString().slice(0,10);
  const tasks=getTodayTasks();
  tasks.push({id:"c"+Date.now(),name,course:document.getElementById("taskCourse").value,desc:document.getElementById("taskDesc").value.trim(),done:false,date:dateKey});
  saveTaskStore(tasks);closeModal("taskModal");document.getElementById("taskName").value="";document.getElementById("taskDesc").value="";renderTasks();
}
function renderSchedule(){
  const w=getWeek(), el=document.getElementById("weekSchedule");
  let out="";
  for(let d=1;d<=5;d++){
    const arr=classes.filter(c=>c.d===d&&inWeek(c.w,w));
    out+=`<div style="padding:10px 0 4px;font-weight:800">${dayName(d)}</div>`;
    out+=arr.length?arr.map(c=>`<div class="classrow"><div class="time">${times[c.d][c.t]}</div><div><div class="classname">${c.n}</div><div class="room">教室：${c.r}</div></div></div>`).join(""):'<div class="empty">无课</div>';
  }
  el.innerHTML=out;
}
function renderCourses(){document.getElementById("courseList").innerHTML=courses.map(x=>`<div class="listbtn"><b>${x}</b><div class="small">后续可继续加入题库、知识点和错题</div></div>`).join("")}
function methods(){return JSON.parse(localStorage.getItem("ai_v15_methods")||"[]")}
function renderMethods(){
  const built=[
    ["极限的和差积商法则","高等数学","极限存在时可按和、差、积运算；商法则要求分母极限不为0。"],
    ["两个重要极限","高等数学","sin x / x → 1（x→0）；(1+1/x)^x → e（x→∞）。"],
    ["立方差公式","高等数学","a³−b³=(a−b)(a²+ab+b²)，常用于0/0型极限约分。"],
    ["四级听力精听法","CET-4","先做题再精听；标出听不懂的位置，回听并核对原文。"]
  ].concat(methods());
  document.getElementById("methodList").innerHTML=built.map(m=>`<div class="classrow"><div><div class="classname">${m[0]}</div><div class="room">${m[1]}</div><div class="weeks">${m[2]}</div></div></div>`).join("");
}
function openMethodModal(){
  document.getElementById("methodCourse").innerHTML=courses.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("methodModal").classList.add("show");
}
function saveMethod(){
  const n=document.getElementById("methodName").value.trim(),c=document.getElementById("methodCourse").value,ct=document.getElementById("methodContent").value.trim();if(!n||!ct)return;
  const a=methods();a.push([n,c,ct]);localStorage.setItem("ai_v15_methods",JSON.stringify(a));
  closeModal("methodModal");document.getElementById("methodName").value="";document.getElementById("methodContent").value="";renderMethods();
}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function showPage(id,btn){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}
renderHeader();renderClasses();renderTasks();renderSchedule();renderCourses();renderMethods();
</script>
</body>
</html>
