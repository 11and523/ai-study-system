<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>AI学习系统</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f6f7fb;color:#17181c}.app{max-width:720px;margin:auto;padding-bottom:75px}header{padding:24px 18px 12px;background:#fff;position:sticky;top:0;z-index:2}h1{margin:0 0 5px;font-size:28px}.sub,.meta,.small{color:#777;font-size:13px}.card{background:#fff;border-radius:16px;margin:12px 14px;padding:16px;box-shadow:0 2px 12px #0000000d}.section-title{font-weight:700;font-size:17px;margin-bottom:12px}.progress{font-size:13px;color:#666;margin-bottom:8px}.bar{height:8px;background:#eceef2;border-radius:99px}.fill{height:100%;background:#111;border-radius:99px}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row:last-child,.course:last-child{border:0}.check{width:22px;height:22px}.main{flex:1}.title{font-weight:600}.page{display:none}.page.active{display:block}.empty{color:#888;font-size:14px;padding:8px 0}.day{font-weight:700;margin:14px 0 6px}.course{padding:10px 0;border-bottom:1px solid #eee}.time{font-size:12px;color:#777;margin-top:4px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:5}nav button{border:0;background:none;padding:11px 16px;color:#777;font-size:12px}nav button.active{color:#111;font-weight:700}</style></head><body><div class="app">
<header><h1 id="title">今日学习</h1><div id="date" class="sub"></div></header>
<main id="home" class="page active"><div class="card"><div id="prog" class="progress"></div><div class="bar"><div id="fill" class="fill"></div></div></div><div class="card"><div class="section-title">今日课程</div><div id="today"></div></div><div class="card"><div class="section-title">今日任务</div><div id="tasks"></div></div><div class="card"><div class="section-title">学习建议</div><div class="small">先完成当天课程对应复习，再完成四级和高数核心任务。后续会接入错题与知识点掌握度，自动调整任务。</div></div></main>
<main id="schedule" class="page"><div class="card"><div class="section-title">2026–2027学年第一学期</div><div class="small">第1周：2026-09-07；教学周1–16，考试周17–19</div><div id="sched"></div></div></main>
<main id="courses" class="page"><div class="card"><div class="section-title">课程</div><div id="courseList"></div></div></main>
<main id="wrong" class="page"><div class="card"><div class="section-title">错题</div><div class="empty">V1.1暂保留入口。后续接入题库后，做错的题会自动记录。</div></div></main>
<nav><button class="active" onclick="page('home',this)">今日学习</button><button onclick="page('schedule',this)">课程表</button><button onclick="page('courses',this)">课程</button><button onclick="page('wrong',this)">错题</button></nav></div>
<script>
const start=new Date('2026-09-07T00:00:00');
const C=[
['大学英语AI',1,'08:30','10:00'],['英语口语（ACCA&CIMA）',1,'10:20','11:50'],['会计专业英语',1,'14:00','15:30'],['中国近现代史纲要',1,'15:50','18:10'],['职业生涯规划与就业指导',1,'19:00','21:20','部分周次为管理学实验'],
['心理健康',2,'08:30','10:00','部分周次'],['高等数学',2,'10:20','11:50'],['大学体育1（气排球）',2,'14:00','15:30'],['会计学',2,'19:00','21:20'],
['大学英语AI',3,'08:30','10:00'],['计算思维导论',3,'10:20','11:50'],['管理学',3,'14:00','15:30'],['高等数学',3,'15:50','18:10'],['形势与政策',3,'19:00','21:20'],
['ACCA导论',4,'08:30','10:00'],['管理学实验',4,'10:20','11:50','部分周次'],
['英语写作CI',5,'08:30','10:00'],['计算思维导论实验',5,'10:20','11:50'],['管理学',5,'14:00','15:30','部分周次'],['会计专业英语',5,'15:50','18:10','部分周次']
];
const T=[['四级词汇','CET-4','30词',30],['四级听力','CET-4','真题听力训练',30],['四级阅读','CET-4','阅读真题1组',25],['高数复习','高等数学','复习当天/最近知识点',35],['专业英语','会计专业英语','复习课堂重点',20]];
const key='ais_v11_';
function wn(d){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-start)/604800000)+1}
function ds(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]+' · 第'+wn(d)+'周'}
function tasks(d){let k=key+d.toISOString().slice(0,10),x=localStorage.getItem(k);if(x)return JSON.parse(x);let a=T.map((v,i)=>({id:i,title:v[0],tag:v[1],meta:v[2],min:v[3],done:false}));localStorage.setItem(k,JSON.stringify(a));return a}
function render(){let d=new Date(),a=tasks(d),done=a.filter(x=>x.done).length;document.getElementById('date').textContent=ds(d);document.getElementById('prog').textContent='今日进度 '+done+'/'+a.length;document.getElementById('fill').style.width=done/a.length*100+'%';let wd=d.getDay()||7,cc=C.filter(x=>x[1]===wd);document.getElementById('today').innerHTML=cc.length?cc.map(x=>'<div class="row"><div class="main"><div class="title">'+x[0]+'</div><div class="meta">'+x[2]+'–'+x[3]+(x[4]?' · '+x[4]:'')+'</div></div></div>').join(''):'<div class="empty">今天没有安排课程。</div>';document.getElementById('tasks').innerHTML=a.map((x,i)=>'<div class="row"><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggle('+i+')"><div class="main"><div class="title">'+x.title+'</div><div class="meta">'+x.tag+' · '+x.meta+' · 约'+x.min+'分钟</div></div></div>').join('')}
function toggle(i){let d=new Date(),k=key+d.toISOString().slice(0,10),a=tasks(d);a[i].done=!a[i].done;localStorage.setItem(k,JSON.stringify(a));render()}
function build(){let names=['星期一','星期二','星期三','星期四','星期五'];document.getElementById('sched').innerHTML=names.map((n,i)=>'<div class="day">'+n+'</div>'+C.filter(x=>x[1]===i+1).map(x=>'<div class="course"><b>'+x[0]+'</b><div class="time">'+x[2]+'–'+x[3]+(x[4]?' · '+x[4]:'')+'</div></div>').join('')).join('');document.getElementById('courseList').innerHTML=[...new Set(C.map(x=>x[0]))].map(x=>'<div class="course"><b>'+x+'</b></div>').join('')}
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('title').textContent={home:'今日学习',schedule:'课程表',courses:'课程',wrong:'错题'}[id]}
render();build();
</script></body></html>
