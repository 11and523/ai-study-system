<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d162b">
<title>AI学习系统</title>
<style>
:root{
  --navy:#0d162b;--navy2:#16233e;--blue:#2455a6;--text:#172033;
  --muted:#7b8494;--line:#e7e9ee;--bg:#f5f6f8;--card:#fff;--soft:#eef2f7;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.hero{background:linear-gradient(155deg,#09111f,#17233b 65%,#111a2e);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 24px;border-radius:0 0 26px 26px}
.hero .date{font-size:13px;opacity:.68;margin-bottom:8px}.hero h1{margin:0;font-size:32px;letter-spacing:-1px}.hero .sub{margin-top:7px;font-size:14px;opacity:.72}
.wrap{padding:18px 16px}.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(15,25,45,.02);border:1px solid #eef0f4}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.title{font-size:18px;font-weight:750}.count{font-size:13px;color:var(--muted)}
.progressbar{height:10px;background:#edf0f4;border-radius:999px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--blue);border-radius:999px;width:0%;transition:.25s}
.daypill{background:#f0f2f5;color:#707887;border-radius:999px;padding:6px 10px;font-size:12px}
.classrow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.classrow:last-child{border-bottom:0;padding-bottom:2px}
.time{width:72px;flex:none;font-size:12px;color:#6f7786;line-height:1.5}.classname{font-weight:700;font-size:15px}.room{margin-top:4px;color:#697384;font-size:12px}.weeks{margin-top:3px;color:#9aa1ad;font-size:11px}
.empty{color:#9aa1ad;font-size:14px;padding:8px 0}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.check{appearance:none;width:24px;height:24px;border:2px solid #aeb4bf;border-radius:7px;flex:none;margin-top:1px;background:#fff}.check:checked{background:var(--blue);border-color:var(--blue);position:relative}.check:checked:after{content:"✓";color:#fff;font-weight:800;position:absolute;left:4px;top:-1px}
.task.done .tt{color:#a0a6b0;text-decoration:line-through}.tt{font-size:15px;font-weight:700}.tag{display:inline-block;background:#eef1f5;color:#697283;border-radius:999px;padding:3px 7px;font-size:10px;margin-right:6px}.desc{font-size:12px;color:#7a8391;margin-top:4px;line-height:1.5}
.addbtn{border:0;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}.primary{background:var(--blue)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(680px,100%);height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #e6e8ed;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:#8b93a0;font-size:11px}.nav button.active{color:var(--navy);font-weight:700}.nav .ico{display:block;font-size:19px;margin-bottom:3px}
.page{display:none}.page.active{display:block}
.listbtn{width:100%;text-align:left;border:0;background:#fff;padding:14px 0;border-bottom:1px solid var(--line)}
.qcat{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 14px;margin:7px 0;border:1px solid #e6e9ef;background:#fff;border-radius:14px;text-align:left}
.qcat b{font-size:15px}.qcat small{display:block;color:#8a93a2;margin-top:4px}.arrow{color:#9aa1ad;font-size:18px}
.qbox{padding:15px 0;border-bottom:1px solid var(--line)}.qbox:last-child{border-bottom:0}
.answer{width:100%;text-align:left;border:1px solid #e1e5ec;background:#fff;border-radius:12px;padding:12px;margin-top:7px}
.answer.selected{border-color:#2455a6;background:#eef4ff}.answer.correct{border-color:#3d9a61;background:#eff9f2}.answer.wrong{border-color:#cf5966;background:#fff1f2}

select,textarea,input[type=text]{width:100%;border:1px solid #dfe3ea;border-radius:12px;padding:11px;background:#fff;outline:none}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}.small{font-size:12px;color:var(--muted);line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;padding:70px 16px 20px}.modal.show{display:block}.modalbox{background:#fff;border-radius:20px;padding:18px;max-width:620px;margin:auto;max-height:85vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0f2f5;border-radius:50%;width:34px;height:34px}
@media(min-width:681px){body{padding:20px 0}.app{box-shadow:0 10px 40px rgba(0,0,0,.08);border-radius:28px;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="date" id="dateLine"></div>
    <h1>今日学习</h1>
    <div class="sub" id="weekLine"></div>
  </section>

  <main class="wrap">
    <section id="home" class="page active">
      <div class="card">
        <div class="cardhead"><div class="title">今日进度</div><div class="count" id="progressText">0/5</div></div>
        <div class="progressbar"><i id="progressFill"></i></div>
      </div>

      <div class="card">
        <div class="cardhead"><div class="title">今天要做</div><button class="addbtn" onclick="openTaskModal()">＋ 添加</button></div>
        <div id="tasks">
          <div class="task"><input class="check" type="checkbox"><div><div class="tt">四级词汇</div><div><span class="tag">CET-4</span></div><div class="desc">完成今天安排的词汇 + 昨日遗忘词复习</div></div></div>
          <div class="task"><input class="check" type="checkbox"><div><div class="tt">四级听力</div><div><span class="tag">CET-4</span></div><div class="desc">完成今天指定听力训练；记录听不懂的位置</div></div></div>
          <div class="task"><input class="check" type="checkbox"><div><div class="tt">高数复习</div><div><span class="tag">高等数学</span></div><div class="desc">复习当前章节定义、公式与典型题，不跳过基础概念</div></div></div>
          <div class="task"><input class="check" type="checkbox"><div><div class="tt">当天课程整理</div><div><span class="tag">课程整理</span></div><div class="desc">把今天课堂讲到的重点整理进对应知识库</div></div></div>
        </div>
      </div>
    </section>

    <section id="schedule" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">本周课程</div><div class="small" id="scheduleWeek"></div></div>
        <div id="weekSchedule"><div class="empty">正在读取本周课程……</div></div>
      </div>
    </section>

    <section id="courses" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">课程</div></div>
        <div id="courseList"></div>
      </div>
    </section>

    <section id="methods" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">知识库</div><button class="addbtn" onclick="openMethodModal()">＋ 添加</button></div>
        <div class="small">先选课程，再进入该课程的方法、公式和知识点。</div>
        <div id="knowledgeCategories" style="margin-top:12px">
          <button class="qcat"><div><b>高等数学</b><small>极限、公式、定理、做题方法</small></div><div class="arrow">›</div></button>
          <button class="qcat"><div><b>CET-4</b><small>词汇、听力、阅读、翻译、写作</small></div><div class="arrow">›</div></button>
          <button class="qcat"><div><b>会计学</b><small>会计概念、分录、易错点</small></div><div class="arrow">›</div></button>
          <button class="qcat"><div><b>会计专业英语</b><small>专业词汇和课堂重点</small></div><div class="arrow">›</div></button>
          <button class="qcat"><div><b>计算思维导论</b><small>计算思维、人工智能、课程重点</small></div><div class="arrow">›</div></button>
        </div>
      </div>
      <div class="card" id="knowledgeDetail" style="display:none">
        <div class="cardhead"><div class="title" id="knowledgeTitle"></div><button class="pill" onclick="closeKnowledge()">返回分类</button></div>
        <div id="methodList"></div>
      </div>
    </section>

    <section id="questions" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">题库</div><div class="small" id="questionCategoryLabel">选择课程</div></div>
        <div id="questionCategories"></div>
      </div>
    </section>

    <section id="wrong" class="page">
      <div class="card">
        <div class="cardhead"><div class="title">错题</div></div>
        <div id="wrongList" class="empty">做题后，错题会自动记录在这里。</div>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button class="active" onclick="showPage('home',this)"><span class="ico">⌂</span>今日学习</button>
    <button onclick="showPage('schedule',this)"><span class="ico">▦</span>课程表</button>
    <button onclick="showPage('questions',this)"><span class="ico">✓</span>题库</button>
    <button onclick="showPage('methods',this)"><span class="ico">≡</span>知识库</button>
    <button onclick="showPage('wrong',this)"><span class="ico">✕</span>错题</button>
  </nav>
</div>

<div class="modal" id="taskModal"><div class="modalbox">
  <div class="modalhead"><div class="title">添加今日任务</div><button class="close" onclick="closeModal('taskModal')">×</button></div>
  <label>任务名称</label><input id="taskName" type="text" placeholder="例如：复习高数第七节">
  <label>课程</label><select id="taskCourse"></select>
  <label>说明</label><textarea id="taskDesc" rows="3" placeholder="写下具体要做什么"></textarea>
  <button class="addbtn primary" style="width:100%;margin-top:14px" onclick="saveTask()">保存</button>
</div></div>

<div class="modal" id="methodModal"><div class="modalbox">
  <div class="modalhead"><div class="title">添加方法 / 知识点</div><button class="close" onclick="closeModal('methodModal')">×</button></div>
  <label>名称</label><input id="methodName" type="text" placeholder="例如：洛必达法则">
  <label>分类</label><select id="methodCourse"></select>
  <label>内容</label><textarea id="methodContent" rows="5" placeholder="公式、适用条件、做题方法……"></textarea>
  <button class="addbtn primary" style="width:100%;margin-top:14px" onclick="saveMethod()">保存</button>
</div></div>

<script>
const START = new Date("2026-09-07T00:00:00");
const times = {
  1:["08:30–10:00","10:20–11:50","14:00–15:30","15:50–18:10","19:00–21:20"],
  2:["08:30–10:00","10:20–11:50","14:00–15:30","19:00–21:20"],
  3:["08:30–10:00","10:20–11:50","14:00–15:30","15:50–18:10","19:00–21:20"],
  4:["08:30–10:00","10:20–11:50"],
  5:["08:30–10:00","10:20–11:50","14:00–15:30","15:50–18:10"]
};
const classes = [
 {d:1,t:0,n:"大学英语AI",r:"20208",w:"3–16周 [01–02节]"},
 {d:1,t:1,n:"英语口语（ACCA&CIMA）",r:"20201",w:"3–16周 [03–04节]"},
 {d:1,t:2,n:"专业英语",r:"20201",w:"3–16周 [05–06节]"},
 {d:1,t:3,n:"中国近现代史纲要",r:"20214",w:"3–16周 [07–09节]"},
 {d:1,t:4,n:"职业生涯规划与就业指导I",r:"20307",w:"4–11周 [10–11节]"},
 {d:1,t:4,n:"管理学实验",r:"20307",w:"12–16周 [10–12节]"},

 {d:2,t:0,n:"心理健康",r:"20214",w:"7、9、11、13周 [01–02节]"},
 {d:2,t:1,n:"高等数学",r:"20113",w:"3–17周 [03–04节]"},
 {d:2,t:2,n:"大学体育1（气排球）",r:"崇德楼室外篮球场04",w:"3–17周 [05–06节]"},
 {d:2,t:4,n:"会计学",r:"20102",w:"4–14周 [10–12节]"},

 {d:3,t:0,n:"大学英语AI",r:"20102",w:"4、6、8、10、12、14、16周 [01–02节]"},
 {d:3,t:0,n:"大学英语AI",r:"30203",w:"3、5、7、9、11、13、15周 [01–02节]"},
 {d:3,t:1,n:"计算思维导论",r:"20102",w:"3–14周 [03–04节]"},
 {d:3,t:1,n:"英语口语（ACCA&CIMA）",r:"20102",w:"15–16周 [03–04节]"},
 {d:3,t:2,n:"管理学",r:"20315",w:"3–12周 [05–06节]"},
 {d:3,t:3,n:"高等数学",r:"20213",w:"3–17周 [07–09节]"},
 {d:3,t:4,n:"形势与政策I",r:"20309",w:"5、7、9、11、13周 [10–11节]"},

 {d:4,t:0,n:"ACCA导论",r:"20102",w:"3周 [01–04节]"},
 {d:4,t:0,n:"ACCA导论",r:"20102",w:"5–15周 [01–04节]"},
 {d:4,t:1,n:"管理学实验",r:"20209",w:"16周（双周）[03–04节]"},

 {d:5,t:0,n:"英语写作CI",r:"20213",w:"3–16周 [01–02节]"},
 {d:5,t:1,n:"计算思维导论实验",r:"30305",w:"3–17周 [03–04节]"},
 {d:5,t:2,n:"管理学",r:"20313",w:"3–12周 [05–06节]"},
 {d:5,t:3,n:"专业英语",r:"20102",w:"15–16周 [07–08节]"}
];

const courses=["高等数学","CET-4","会计学","会计专业英语","大学英语AI","计算思维导论","管理学","ACCA导论","英语口语","英语写作","中国近现代史纲要","心理健康","大学体育","形势与政策","职业生涯规划与就业指导"];

const defaultTasks=[
 ["四级词汇","CET-4","完成今天安排的词汇 + 昨日遗忘词复习"],
 ["四级听力","CET-4","完成今天指定真题听力；做完记录听不懂的位置"],
 ["高数复习","高等数学","复习当前章节的定义、公式与典型题，不跳过基础概念"],
 ["专业英语","会计专业英语","复习课堂专业词汇和老师讲过的重点"],
 ["当天课程整理","其他","把今天课堂讲到的重点整理进对应知识库"]
];

function getWeek(d=new Date()){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const s=new Date(START.getFullYear(),START.getMonth(),START.getDate());
  return Math.floor((x-s)/86400000/7)+1;
}
function inWeek(spec,w){
  const clean=String(spec).replace(/周/g,"").replace(/（.*?）/g,"");
  const ranges=[...clean.matchAll(/(\d+)\s*[–-]\s*(\d+)/g)];
  for(const m of ranges){ if(w>=+m[1] && w<=+m[2]) return true; }
  const nums=[...clean.matchAll(/\d+/g)].map(m=>+m[0]);
  return nums.includes(w);
}
function dayName(d){return ["","星期一","星期二","星期三","星期四","星期五","星期六","星期日"][d]}
function getDay(){let d=new Date().getDay();return d===0?7:d}
function todayClasses(){
  const d=getDay(),w=getWeek();
  return classes.filter(c=>c.d===d&&inWeek(c.w,w));
}
function fmtDate(){
  const d=new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${dayName(getDay())}`;
}
function renderHeader(){
  document.getElementById("dateLine").textContent=fmtDate();
  const w=getWeek();
  document.getElementById("weekLine").textContent=`第 ${w} 周 · ${w>=1&&w<=16?"正常教学周":"考试/非教学周"}`;
  document.getElementById("scheduleWeek").textContent=`第 ${w} 周`;
}
function taskStore(){return JSON.parse(localStorage.getItem("ai_v19_tasks")||"[]")}
function saveTaskStore(x){localStorage.setItem("ai_v19_tasks",JSON.stringify(x))}
function dateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function taskHTML(t,done,key){
  return `<div class="task ${done?"done":""}"><input class="check" type="checkbox" ${done?"checked":""} onchange="toggleTaskKey('${key.replace(/'/g,"\\'")}')"><div><div class="tt">${t.name}</div><div><span class="tag">${t.course}</span></div><div class="desc">${t.desc||""}</div></div></div>`;
}
function fixedDailyTasks(){
  return [
    ["四级词汇","CET-4","完成今天安排的词汇 + 昨日遗忘词复习"],
    ["四级听力","CET-4","完成今天指定听力训练；记录听不懂的位置"],
    ["高数复习","高等数学","复习当前章节定义、公式与典型题，不跳过基础概念"],
    ["当天课程整理","课程整理","把今天课堂讲到的重点整理进对应知识库"]
  ];
}
function classTask(c,i){
  const academic=new Set(["大学英语AI","英语口语（ACCA&CIMA）","专业英语","中国近现代史纲要","高等数学","会计学","计算思维导论","管理学","ACCA导论","英语写作CI","形势与政策"]);
  if(!academic.has(c.n)) return null;
  return {name:`复习${c.n}`,course:c.n,desc:`整理今天课堂重点、公式/词汇和老师强调的内容。`};
}
function todayClassEntries(){
  return todayClasses().map((c,i)=>({c,i,t:classTask(c,i)})).filter(x=>x.t);
}
function renderTasks(){
  const key=dateKey();
  let st=JSON.parse(localStorage.getItem("ai_v19_day")||"{}");
  if(st.date!==key){st={date:key,daily:{},classes:{},custom:[]};localStorage.setItem("ai_v19_day",JSON.stringify(st));}
  const fixed=fixedDailyTasks();
  const entries=todayClassEntries();
  const custom=st.custom||[];
  let html="";
  fixed.forEach((x,i)=>{html+=taskHTML({name:x[0],course:x[1],desc:x[2]},!!st.daily[i],`d-${i}`)});
  entries.forEach((x)=>{const id=`c-${x.i}`;html+=taskHTML(x.t,!!st.classes[id],id)});
  custom.forEach((x,i)=>{html+=taskHTML(x,!!x.done,`u-${i}`)});
  document.getElementById("tasks").innerHTML=html||'<div class="empty">今天暂时没有安排的学习任务。</div>';
  const total=fixed.length+entries.length+custom.length;
  const done=fixed.filter((x,i)=>st.daily[i]).length+entries.filter(x=>st.classes[`c-${x.i}`]).length+custom.filter(x=>x.done).length;
  document.getElementById("progressText").textContent=`${done}/${total}`;
  document.getElementById("progressFill").style.width=total?`${done/total*100}%`:"0%";
}
function toggleTaskKey(key){
  const date=dateKey();let st=JSON.parse(localStorage.getItem("ai_v19_day")||"{}");
  if(st.date!==date){st={date,daily:{},classes:{},custom:[]};}
  if(key.startsWith("d-")){const i=+key.slice(2);st.daily[i]=!st.daily[i];}
  else if(key.startsWith("c-")){st.classes[key]=!st.classes[key];}
  else if(key.startsWith("u-")){const i=+key.slice(2);if(st.custom[i])st.custom[i].done=!st.custom[i].done;}
  localStorage.setItem("ai_v19_day",JSON.stringify(st));renderTasks();
}
function openTaskModal(){
  document.getElementById("taskCourse").innerHTML=courses.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("taskModal").classList.add("show");
}
function saveTask(){
  const name=document.getElementById("taskName").value.trim();if(!name)return;
  const date=dateKey();let st=JSON.parse(localStorage.getItem("ai_v19_day")||"{}");
  if(st.date!==date){st={date,daily:{},classes:{},custom:[]};}
  st.custom=st.custom||[];st.custom.push({name,course:document.getElementById("taskCourse").value,desc:document.getElementById("taskDesc").value.trim(),done:false});
  localStorage.setItem("ai_v19_day",JSON.stringify(st));closeModal("taskModal");document.getElementById("taskName").value="";document.getElementById("taskDesc").value="";renderTasks();
}
function renderSchedule(){
  const w=getWeek(), el=document.getElementById("weekSchedule");
  let out="";
  for(let d=1;d<=5;d++){
    const arr=classes.filter(c=>c.d===d&&inWeek(c.w,w));
    out+=`<div style="padding:10px 0 4px;font-weight:800">${dayName(d)}${d===getDay()?" · 今天":""}</div>`;
    out+=arr.length?arr.map(c=>`<div class="classrow"><div class="time">${times[c.d][c.t]}</div><div><div class="classname">${c.n}</div><div class="room">教室：${c.r}</div></div></div>`).join(""):'<div class="empty">无课</div>';
  }
  el.innerHTML=out;
}
function renderCourses(){document.getElementById("courseList").innerHTML=courses.map(x=>`<div class="listbtn"><b>${x}</b><div class="small">后续可继续加入题库、知识点和错题</div></div>`).join("")}
function methods(){return JSON.parse(localStorage.getItem("ai_v15_methods")||"[]")}
function renderMethods(){
  const all=[
    ["高等数学","math","极限、公式、定理、做题方法"],
    ["CET-4","english","词汇、听力、阅读、翻译、写作"],
    ["会计学","accounting","会计概念、分录、易错点"],
    ["会计专业英语","proenglish","专业词汇和课堂重点"],
    ["计算思维导论","computer","计算思维、人工智能、课程重点"]
  ];
  document.getElementById("knowledgeCategories").innerHTML=all.map(x=>
    `<button class="qcat" onclick="openKnowledge('${x[1]}','${x[0]}')"><div><b>${x[0]}</b><small>${x[2]}</small></div><div class="arrow">›</div></button>`
  ).join("");
}
function openKnowledge(filter,title){
  const built=[
    ["极限的和差积商法则","math","若各极限存在，则和、差、积可直接分别取极限；商法则还要求分母极限不为0。"],
    ["两个重要极限","math","lim(x→0) sin x/x=1；lim(x→∞)(1+1/x)^x=e。"],
    ["立方差公式","math","a³−b³=(a−b)(a²+ab+b²)，常用于0/0型极限约分。"],
    ["四级听力精听法","english","第一遍做题；第二遍看原文核对；第三遍关闭原文重新听。"],
    ["asset","proenglish","资产；会计专业英语高频词。"],
    ["liability","proenglish","负债；会计专业英语高频词。"],
    ["机器学习","computer","机器学习是人工智能的重要技术基础。"]
  ].concat(methods());
  const list=built.filter(x=>x[1]===filter);
  document.getElementById("knowledgeTitle").textContent=title;
  document.getElementById("methodList").innerHTML=list.length?list.map(m=>`<div class="classrow"><div><div class="classname">${m[0]}</div><div class="weeks">${m[2]}</div></div></div>`).join(""):'<div class="empty">这个分类目前还没有内容，可以点击右上角“添加”。</div>';
  document.getElementById("knowledgeDetail").style.display="block";
  document.getElementById("knowledgeCategories").style.display="none";
}
function closeKnowledge(){document.getElementById("knowledgeDetail").style.display="none";document.getElementById("knowledgeCategories").style.display="block"}
function openMethodModal(){
  document.getElementById("methodCourse").innerHTML=courses.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("methodModal").classList.add("show");
}
function saveMethod(){
  const n=document.getElementById("methodName").value.trim(),c=document.getElementById("methodCourse").value,ct=document.getElementById("methodContent").value.trim();if(!n||!ct)return;
  const a=methods();a.push([n,c,ct]);localStorage.setItem("ai_v15_methods",JSON.stringify(a));
  closeModal("methodModal");document.getElementById("methodName").value="";document.getElementById("methodContent").value="";renderMethods();
}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function showPage(id,btn){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  if(id==="questions")renderQuestionCategories();
  if(id==="schedule")renderSchedule();
  if(id==="methods")renderMethods();
  if(id==="home")renderTasks();
}

const questionBank = {
  "CET-4":[
    ["词汇","The new policy may ______ the development of small businesses.",["A. affect","B. effect","C. afford","D. effort"],0,"affect 是动词“影响”。"],
    ["词汇","Students should be ______ of the importance of time management.",["A. aware","B. awake","C. alive","D. alone"],0,"be aware of = 意识到。"],
    ["阅读","Focused study with regular breaks can be more effective than simply studying for longer hours. What is the main idea?",["A. Longer study is always better.","B. Breaks are unnecessary.","C. Focused study and breaks may improve learning.","D. Students should study all night."],2,"文章强调专注学习与适当休息。"]
  ],
  "高等数学":[
    ["极限","若 lim(x→0) sin x / x = ?",["A. 0","B. 1","C. ∞","D. 不存在"],1,"重要极限：lim(x→0) sin x/x=1，x 使用弧度。"],
    ["极限","lim(x→∞)(1+1/x)^x = ?",["A. 0","B. 1","C. e","D. ∞"],2,"第二个重要极限，结果为 e。"],
    ["公式","a³−b³ = ?",["A. (a−b)(a²+ab+b²)","B. (a+b)(a²−ab+b²)","C. (a−b)(a²−ab+b²)","D. (a+b)(a²+ab+b²)"],0,"立方差公式，常用于0/0型极限因式分解。"],
    ["极限","求 lim(x→1) (x³−1)/(x−1)。",["A. 0","B. 1","C. 3","D. 不存在"],2,"x³−1=(x−1)(x²+x+1)，约分后代入 x=1 得3。"],
    ["极限","求 lim(x→0) (1−cos x)/x²。",["A. 0","B. 1/2","C. 1","D. 不存在"],1,"利用 1−cos x=2sin²(x/2)，得到 1/2。"]
  ],
  "会计学":[
    ["基础概念","会计的基本职能主要包括？",["A. 核算和监督","B. 生产和销售","C. 采购和仓储","D. 预测和招聘"],0,"会计的基本职能通常表述为核算和监督。"]
  ],
  "会计专业英语":[
    ["词汇","asset 的中文含义是？",["A. 负债","B. 资产","C. 收入","D. 费用"],1,"asset = 资产。"],
    ["词汇","liability 的中文含义是？",["A. 资产","B. 所有者权益","C. 负债","D. 利润"],2,"liability = 负债。"]
  ],
  "计算思维导论":[
    ["人工智能","机器学习通常被视为人工智能的重要核心技术之一。",["A. 正确","B. 错误"],0,"机器学习是现代人工智能的重要技术基础。"]
  ]
};
let qCategory="", qIndex=0, qSelected=null, qAnswered=false;

function renderQuestionCategories(){
  const el=document.getElementById("questionCategories");
  el.innerHTML=Object.keys(questionBank).map(c=>{
    const n=questionBank[c].length;
    return `<button class="qcat" onclick="openQuestionSet('${c.replace(/'/g,"\\'")}')"><div><b>${c}</b><small>${n} 道题 · 进入后逐题作答</small></div><div class="arrow">›</div></button>`;
  }).join("");
}
function openQuestionSet(c){
  qCategory=c;qIndex=0;qSelected=null;qAnswered=false;
  renderQuestion();
}
function renderQuestion(){
  const el=document.getElementById("questionCategories");
  const arr=questionBank[qCategory];
  if(!arr){renderQuestionCategories();return}
  const q=arr[qIndex];
  document.getElementById("questionCategoryLabel").textContent=`${qCategory} · ${qIndex+1}/${arr.length}`;
  el.innerHTML=`
    <div class="qbox">
      <div class="small">${q[0]}</div>
      <div style="font-size:18px;font-weight:750;line-height:1.7;margin:10px 0">${q[1]}</div>
      <div id="qopts">${q[2].map((x,i)=>`<button class="answer" onclick="selectQuestion(${i})">${x}</button>`).join("")}</div>
      <button class="addbtn primary" style="width:100%;margin-top:12px" onclick="submitQuestion()">提交答案</button>
      <div id="qfeedback"></div>
      <button class="addbtn" style="width:100%;margin-top:9px;display:none" id="qnext" onclick="nextQuestion()">下一题</button>
      <button class="pill" style="margin-top:12px;border:0" onclick="renderQuestionCategories()">返回课程分类</button>
    </div>`;
}
function selectQuestion(i){
  if(qAnswered)return;
  qSelected=i;
  document.querySelectorAll("#qopts .answer").forEach((x,k)=>x.classList.toggle("selected",k===i));
}
function submitQuestion(){
  if(qSelected===null){alert("请先选择答案");return}
  if(qAnswered)return;
  qAnswered=true;
  const q=questionBank[qCategory][qIndex],ok=qSelected===q[3];
  let st=JSON.parse(localStorage.getItem("ai_v17_questions")||"[]");
  st.push({category:qCategory,question:q[1],correct:ok,date:new Date().toISOString()});
  localStorage.setItem("ai_v17_questions",JSON.stringify(st));
  document.querySelectorAll("#qopts .answer").forEach((x,k)=>{
    if(k===q[3])x.classList.add("correct");
    if(k===qSelected&&k!==q[3])x.classList.add("wrong");
  });
  document.getElementById("qfeedback").innerHTML=`<div class="desc" style="margin-top:12px"><b>${ok?"✓ 回答正确":"✕ 回答错误"}</b>　正确答案：${q[2][q[3]]}<br>${q[4]}</div>`;
  const nx=document.getElementById("qnext");
  nx.style.display="block";nx.textContent=qIndex<questionBank[qCategory].length-1?"下一题":"完成本组";
}
function nextQuestion(){
  const arr=questionBank[qCategory];
  if(qIndex<arr.length-1){qIndex++;qSelected=null;qAnswered=false;renderQuestion()}
  else{renderQuestionCategories();document.getElementById("questionCategoryLabel").textContent="选择课程"}
}

window.addEventListener("DOMContentLoaded",()=>{
  try{renderHeader()}catch(e){console.error(e)}
  try{renderTasks()}catch(e){console.error(e)}
  try{renderSchedule()}catch(e){console.error(e)}
  try{renderCourses()}catch(e){console.error(e)}
  try{renderMethods()}catch(e){console.error(e)}
  try{renderQuestionCategories()}catch(e){console.error(e)}
});
</script>
